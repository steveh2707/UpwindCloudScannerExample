name: Docker Image Scan

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:

      - name: Verify Upwind secret exists
        run: |
          if [ -z "${{ secrets.UPWIND_CLIENT_ID }}" ]; then
            echo "UPWIND_CLIENT_ID is missing"
            exit 1
          else
            echo "UPWIND_CLIENT_ID is set"
          fi
          if [ -z "${{ secrets.UPWIND_CLIENT_SECRET }}" ]; then
            echo "UPWIND_CLIENT_ID is missing"
            exit 1
          else
            echo "UPWIND_CLIENT_ID is set"
          fi

      - name: Upwind Security ShiftLeft Scan
        uses: upwindsecurity/shiftleft-create-image-scan-event-action@main
        with:
          upwind_client_id: ${{ secrets.UPWIND_CLIENT_ID }}
          upwind_client_secret: ${{ secrets.UPWIND_CLIENT_SECRET }}
          docker_image: 'hello-world:latest'
          pull_image: true
          upwind_uri: upwind.dev
